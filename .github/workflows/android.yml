
name: SEIH VASL Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SEIH VASL
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "*.zip" \
            -not -path "*/.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/seih-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/seih-source"

          BUILD_FILE=$(find "$RUNNER_TEMP/seih-source" \
            -type f \( \
              -path "*/android/app/build.gradle.kts" -o \
              -path "*/android/app/build.gradle" \
            \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Android project not found inside ZIP"
            find "$RUNNER_TEMP/seih-source" -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_ROOT="${BUILD_FILE%/android/app/build.gradle.kts}"
          if [ "$PROJECT_ROOT" = "$BUILD_FILE" ]; then
            PROJECT_ROOT="${BUILD_FILE%/android/app/build.gradle}"
          fi

          cp -a "$PROJECT_ROOT/." "$GITHUB_WORKSPACE/"
          echo "Project extracted successfully"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android project
        run: |
          test -d android
          test -f android/app/build.gradle.kts -o \
               -f android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEIH-VASL-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
